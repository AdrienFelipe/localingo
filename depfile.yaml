deptrac:
  paths:
    - ./src
    - ./tests

  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/.*/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/.*/Application/.*
    - name: UI
      collectors:
        - type: directory
          value: src/.*/UI/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/.*/Infrastructure/.*
        - type: classLike
          value: '^(?!App\\|PHPUnit\\|Symfony\\).*\\.*'
    - name: Framework
      collectors:
        - type: classLike
          value: 'Symfony\\.*'
    - name: Test
      collectors:
        - type: classLike
          value: 'PHPUnit\\.*'
        - type: directory
          value: tests/.*

  ruleset:
    UI:
      - Application
      - Domain
    Application:
      - Domain
    Domain: ~
    Infrastructure:
      - Domain
    Framework:
      - Domain
      - Infrastructure
    Test:
      - UI
      - Application
      - Domain
